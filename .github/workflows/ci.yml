name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test

  client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  # Despliegue a producción al llegar a main (requiere el secret VERCEL_TOKEN).
  # Sin el token, el job queda en verde sin desplegar; Vercel Git Integration
  # queda como respaldo de CD.
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [server, client]
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm i -g vercel@latest
      - name: Deploy backend (Vercel serverless)
        if: env.VERCEL_TOKEN != ''
        run: vercel deploy --prod --yes --cwd server --token "$VERCEL_TOKEN"
      - name: Deploy frontend (Vercel)
        if: env.VERCEL_TOKEN != ''
        run: vercel deploy --prod --yes --cwd client --token "$VERCEL_TOKEN"
